[project]
name = "devpulse"
version = "1.0.0"
description = "What do developers say about a tool? Pros and cons cited from Hacker News."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
devpulse = "devpulse.cli:main"

[tool.setuptools]
packages = ["devpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
